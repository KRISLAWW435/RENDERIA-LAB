<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var realFetch = window.fetch;
          var customFetch = realFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch || realFetch;
            },
            set: function(fn) {
              customFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        // Safely suppress third-party extension injection crashes
        window.addEventListener('error', function(e) {
          if (
            (e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
            (e.message && e.message.indexOf('Cannot set property fetch') !== -1)
          ) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        }, true);
      })();
    </script>
    <title>Аватар-лаборатория RENDERIA</title>
    <meta name="description" content="Интерактивная образовательная мастерская создания персонажей Roblox и работы с нейросетями для детей от 8 лет" />

  </head>

  </body>
</html>
