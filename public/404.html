<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>RENDERIA LAB - Перенаправление</title>
    <script>
      // Single Page Apps for GitHub Pages and Static Hosting
      // Preserves path and query parameters by redirecting to index.html with hash routing
      var pathSegmentsToKeep = 0;
      var l = window.location;
      var repoName = l.pathname.split('/')[1];
      // If path is inside a subfolder, keep 1 segment
      if (repoName && repoName !== 'stage-1' && repoName !== 'stage-2' && repoName !== 'stage-3' && repoName !== 'stage-4' && repoName !== 'stage-5' && repoName !== 'stage-6' && repoName !== 'victory') {
        pathSegmentsToKeep = 1;
      }
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
